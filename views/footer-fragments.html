        <script>
        (function () {
            if (!window.fetch || window.__pteroDeferredTitleRequests) {
                return;
            }
            window.__pteroDeferredTitleRequests = true;
            var nativeFetch = window.fetch.bind(window);
            var queuedTitles = [];
            var titlesReleased = false;

            function releaseTitles() {
                if (titlesReleased) {
                    return;
                }
                titlesReleased = true;
                var requests = queuedTitles.splice(0);
                requests.forEach(function (request) {
                    nativeFetch(request.input, request.init).then(request.resolve, request.reject);
                });
            }

            function requestDetails(input, init) {
                var url = typeof input === "string" ? input : (input && input.url ? input.url : "");
                var body = init && init.body;
                return { url: String(url || ""), body: body };
            }

            function isTitleRequest(input, init) {
                var details = requestDetails(input, init);
                if (!/\/mlp\/v1\/chat(?:\?|$)/i.test(details.url) || !details.body) {
                    return false;
                }
                try {
                    var payload = typeof details.body === "string" ? JSON.parse(details.body) : details.body;
                    return !!(payload && typeof payload.message === "string" &&
                        /Create a concise title for this new chat\./i.test(payload.message));
                } catch (ignore) {
                    return false;
                }
            }

            function isChatStreamRequest(input) {
                var url = typeof input === "string" ? input : (input && input.url ? input.url : "");
                return /\/mlp\/v1\/chat-stream(?:\?|$)/i.test(String(url || ""));
            }

            function syncSidebarTitle() {
                var currentTitle = document.getElementById("chat-current-title");
                if (!currentTitle) {
                    return;
                }
                var title = currentTitle.textContent || "";
                document.querySelectorAll(".chat-conv-item.active .chat-conv-title").forEach(function (titleElement) {
                    if (titleElement.textContent !== title) {
                        titleElement.textContent = title;
                    }
                });
            }

            if (window.MutationObserver && document.documentElement) {
                new MutationObserver(syncSidebarTitle).observe(document.documentElement, {
                    subtree: true,
                    childList: true,
                    characterData: true
                });
                setTimeout(syncSidebarTitle, 100);
            }

            window.fetch = function (input, init) {
                /*
                 * Title generation is based on the first user message and
                 * must begin with that first send. Do not hold it behind the
                 * answer stream: a slow, failed, or cancelled stream should
                 * never prevent the new chat from receiving its AI title.
                 */
                var responsePromise = nativeFetch(input, init);
                if (!isChatStreamRequest(input)) {
                    return responsePromise;
                }

                return responsePromise.then(function (response) {
                    if (!response || !response.body || typeof response.body.getReader !== "function" || !response.ok) {
                        setTimeout(releaseTitles, 250);
                        return response;
                    }

                    var originalGetReader = response.body.getReader.bind(response.body);
                    response.body.getReader = function () {
                        var reader = originalGetReader();
                        var originalRead = reader.read.bind(reader);
                        var released = false;
                        function releaseOnce() {
                            if (released) {
                                return;
                            }
                            released = true;
                            setTimeout(releaseTitles, 250);
                        }
                        reader.read = function () {
                            return originalRead().then(function (result) {
                                if (result && result.done) {
                                    releaseOnce();
                                }
                                return result;
                            }, function (error) {
                                releaseOnce();
                                throw error;
                            });
                        };
                        return reader;
                    };
                    return response;
                }, function (error) {
                    setTimeout(releaseTitles, 250);
                    throw error;
                });
            };
        }());
        </script>

        <script>
        (function () {
            var endpoint = "/mlp/v1/api-usage?days=30";
            var nonce = "{{NONCE}}";
            var storageKey = 'mlp_ai_chat_identity';
            var loaded = false;

            function esc(value) {
                return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) {
                    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c];
                });
            }
            function fmt(value) {
                var locale = 'en';
                try { locale = localStorage.getItem('mlp_ai_chat_lang') || 'en'; } catch (e) {}
                return Number(value || 0).toLocaleString(locale);
            }
            function identityToken() {
                try {
                    var data = JSON.parse(localStorage.getItem(storageKey) || 'null');
                    return data && data.token ? data.token : '';
                } catch (e) { return ''; }
            }
            function headers() {
                return {'X-WP-Nonce': nonce, 'X-MLP-Guest-Token': identityToken()};
            }
            function drawChart(series) {
                var width = 720, height = 205, pad = {top:14,right:12,bottom:30,left:38};
                var innerW = width - pad.left - pad.right, innerH = height - pad.top - pad.bottom;
                var max = Math.max.apply(null, series.map(function (d) { return Number(d.requests || 0); }).concat([1]));
                var points = series.map(function (d, i) {
                    var x = pad.left + (series.length <= 1 ? 0 : i * innerW / (series.length - 1));
                    var y = pad.top + innerH - (Number(d.requests || 0) / max * innerH);
                    return x.toFixed(1) + ',' + y.toFixed(1);
                }).join(' ');
                var grid = [0, .5, 1].map(function (ratio) {
                    var y = (pad.top + innerH - ratio * innerH).toFixed(1);
                    var label = Math.round(max * ratio);
                    return '<line x1="' + pad.left + '" x2="' + (width - pad.right) + '" y1="' + y + '" y2="' + y + '" stroke="#eef0f3"/><text x="4" y="' + (Number(y) + 4) + '" fill="#9ca3af" font-size="10">' + esc(label) + '</text>';
                }).join('');
                var labels = [0, Math.floor(series.length / 2), Math.max(0, series.length - 1)].map(function (i) {
                    var x = pad.left + (series.length <= 1 ? 0 : i * innerW / (series.length - 1));
                    return '<text x="' + x.toFixed(1) + '" y="' + (height - 7) + '" text-anchor="middle" fill="#9ca3af" font-size="10">' + esc((series[i] || {}).date || '') + '</text>';
                }).join('');
                return '<svg viewBox="0 0 ' + width + ' ' + height + '" role="img" aria-label="API requests over the last 30 days">' +
                    grid + '<polyline fill="rgba(16,163,127,.10)" stroke="none" points="' + pad.left + ',' + (pad.top + innerH) + ' ' + points + ' ' + (width - pad.right) + ',' + (pad.top + innerH) + '"/>' +
                    '<polyline fill="none" stroke="#10a37f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="' + points + '"/>' + labels + '</svg>';
            }
            function render(data) {
                var root = document.getElementById('chat-api-tab-panel-usage');
                if (!root) return;
                var s = data.summary || {}, l = data.limits || {}, series = data.series || [];
                var keys = (data.keys || []).map(function (key) {
                    return '<div class="ptero-usage-key"><span><strong>' + esc(key.name || 'API key') + '</strong><br><code>' + esc(key.key_prefix || '') + '••••••</code></span><span>' + esc(key.last_used_at ? 'Last used ' + key.last_used_at : 'Not used yet') + '</span></div>';
                }).join('');
                root.innerHTML =
                    '<section id="ptero-api-usage-dashboard">' +
                    '<div class="ptero-usage-head"><div><p class="ptero-usage-eyebrow">Developer analytics</p><h3 class="ptero-usage-title">API usage</h3><p class="ptero-usage-subtitle">Requests and token consumption for your API keys over the last ' + esc(data.period_days || 30) + ' days.</p></div><button type="button" class="ptero-usage-refresh">Refresh</button></div>' +
                    '<div class="ptero-usage-cards">' +
                    '<div class="ptero-usage-card"><div class="ptero-usage-card-label">Requests</div><div class="ptero-usage-card-value">' + fmt(s.requests) + '</div><div class="ptero-usage-card-note">Successful API calls</div></div>' +
                    '<div class="ptero-usage-card"><div class="ptero-usage-card-label">Tokens</div><div class="ptero-usage-card-value">' + fmt(s.tokens) + '</div><div class="ptero-usage-card-note">Estimated when provider data is unavailable</div></div>' +
                    '<div class="ptero-usage-card"><div class="ptero-usage-card-label">Failed requests</div><div class="ptero-usage-card-value">' + fmt(s.failures) + '</div><div class="ptero-usage-card-note">HTTP errors and rejected calls</div></div>' +
                    '<div class="ptero-usage-card"><div class="ptero-usage-card-label">Average latency</div><div class="ptero-usage-card-value">' + fmt(s.avg_latency_ms) + ' ms</div><div class="ptero-usage-card-note">Across recorded requests</div></div>' +
                    '</div>' +
                    '<section class="ptero-usage-panel"><div class="ptero-usage-panel-head"><h4 class="ptero-usage-panel-title">Requests by day</h4><span class="ptero-usage-legend">Last ' + esc(data.period_days || 30) + ' days</span></div><div class="ptero-usage-chart">' + drawChart(series) + '</div></section>' +
                    '<section class="ptero-usage-panel"><div class="ptero-usage-panel-head"><h4 class="ptero-usage-panel-title">Exact API limits</h4><span class="ptero-usage-legend">Shared across each GitHub account or guest identity</span></div><dl class="ptero-usage-limits">' +
                    '<div class="ptero-usage-limit"><dt>Requests per minute</dt><dd>' + fmt(l.requests_per_minute) + '</dd></div>' +
                    '<div class="ptero-usage-limit"><dt>Maximum requests per day</dt><dd>' + fmt(l.requests_per_day) + '</dd></div>' +
                    '<div class="ptero-usage-limit"><dt>Tokens per hour</dt><dd>' + fmt(l.tokens_per_hour) + '</dd></div>' +
                    '<div class="ptero-usage-limit"><dt>Quota reset window</dt><dd>Every 1 hour</dd></div>' +
                    '<div class="ptero-usage-limit"><dt>Maximum output tokens</dt><dd>' + fmt(l.max_output_tokens) + '</dd></div>' +
                    '<div class="ptero-usage-limit"><dt>Usage history retained</dt><dd>' + fmt(l.retention_days) + ' days</dd></div>' +
                    '</dl></section>' +
                    '<section class="ptero-usage-panel"><div class="ptero-usage-panel-head"><h4 class="ptero-usage-panel-title">Tracked API keys</h4></div><p class="ptero-usage-keys">' + (keys || (data.has_api_keys ? 'No key activity recorded yet.' : 'Create an API key to start tracking usage.')) + '</p></section>' +
                    '</section>';
                root.querySelector('.ptero-usage-refresh').addEventListener('click', function () { load(true); });
            }
            function load(force) {
                var root = document.getElementById('chat-api-tab-panel-usage');
                if (!root || (loaded && !force)) return;
                loaded = true;
                root.innerHTML = '<p class="ptero-usage-status">Loading API usage…</p>';
                fetch(endpoint, {credentials:'same-origin', headers:headers(), cache:'no-store'}).then(function (res) {
                    if (!res.ok) throw new Error('Usage data could not be loaded.');
                    return res.json();
                }).then(render).catch(function (error) {
                    root.innerHTML = '<p class="ptero-usage-error">' + esc(error.message || 'Usage data could not be loaded.') + '</p>';
                    loaded = false;
                });
            }
            function replaceDepends() {
                var view = document.getElementById('chat-api-view');
                if (!view) return;
                var walker = document.createTreeWalker(view, NodeFilter.SHOW_TEXT);
                var node;
                while ((node = walker.nextNode())) {
                    node.nodeValue = node.nodeValue
                        .replace(/Depends on hourly token limit/g, '30 requests/minute; 1,000,000 tokens/hour')
                        .replace(/\bDepends\b/g, '30 requests/minute');
                }
            }
            function init() {
                var tab = document.querySelector('.chat-api-tab-btn[data-api-tab="usage"]');
                if (!tab) return setTimeout(init, 500);
                tab.addEventListener('click', function () { setTimeout(function () { replaceDepends(); load(false); }, 0); });
                replaceDepends();
                if (!document.getElementById('chat-api-tab-panel-usage').hidden) load(false);
            }
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
            else init();
        }());
        </script>

        (function () {
            if (window.__pteroAiFalseSearchStatusGuard || !window.fetch || !window.ReadableStream) {

            var liveWebIntent = /\b(?:search|browse|look\s+up|look\s+online|find\s+(?:online|on\s+the\s+web)|google|web|internet|latest|current|today|tonight|tomorrow|yesterday|recent|real[-\s]?time|breaking|news|price|prices|cost|weather|forecast|score|scores|standings|stock|stocks|crypto|exchange\s+rate|release\s+date|updated|update|who\s+won|what\s+happened|available\s+now|near\s+me|fetch|read\s+(?:this|the)\s+(?:page|article))\b/i;

            function noWebRequested(init) {
                if (!init || typeof init.body !== "string") {
                    return false;
                }

                    return body && typeof body.message === "string" && !liveWebIntent.test(body.message);
                } catch (ignore) {
                    return false;
                }

            function isFalseSearchEvent(event) {
                var raw = event.trim();
                if (raw.indexOf("data:") !== 0) {
                    return false;
                }

                    var payload = JSON.parse(raw.slice(5).trim());
                    if (payload && payload.phase === "searching") {
                        return true;
                    }
                    return !!(
                        payload &&
                        payload.activity &&
                        /checking\s+(?:the\s+)?(?:live\s+)?web|searching\s+(?:the\s+)?web/i.test(
                            String(payload.activity.label || "")
                        )
                    );
                } catch (ignore) {
                    return false;
                }
            }

            function filterSse(response) {
                if (!response || !response.body || typeof response.body.getReader !== "function") {
                    return response;
                }
                var reader = response.body.getReader();
                var decoder = new TextDecoder();
                var encoder = new TextEncoder();

                var stream = new ReadableStream({
                    start: function (controller) {
                        function pump() {
                            reader.read().then(function (result) {
                                if (result.done) {
                                    buffer += decoder.decode();
                                    buffer.split(/\n\n/).forEach(function (event) {
                                        if (event && !isFalseSearchEvent(event)) {
                                            controller.enqueue(encoder.encode(event + "\n\n"));
                                        }
                                    });
                                    controller.close();
                                    return;
                                }
                                buffer += decoder.decode(result.value, {stream: true});
                                var events = buffer.split(/\n\n/);
                                buffer = events.pop();
                                events.forEach(function (event) {
                                    if (event && !isFalseSearchEvent(event)) {

                                    }
                                });

        <script>
        (function () {
            var storageKey = "mlp_ai_chat_selected_model";
            var timer = null;

            function readSavedModel() {
                try {
                    return localStorage.getItem(storageKey) || "";
                } catch (ignore) {
                    return "";
                }
            }

            function saveModel(value) {
                if (!value) {
                    return;
                }
                try {
                    localStorage.setItem(storageKey, value);
                } catch (ignore) {}
            }

            function enabledOption(select, value) {
                var option = Array.prototype.find.call(select.options, function (item) {
                    return item.value === value && !item.disabled;
                });
                return option || null;
            }

            function defaultOption(select) {
                return Array.prototype.find.call(select.options, function (item) {
                    return item.defaultSelected && !item.disabled;
                }) || Array.prototype.find.call(select.options, function (item) {
                    return !item.disabled;
                }) || null;
            }

            function ensureModelSelected() {
                var select = document.getElementById("chat-model-select");
                if (!select || !select.options.length) {
                    return;
                }

                var current = enabledOption(select, select.value);
                var saved = enabledOption(select, readSavedModel());
                var target = current || saved || defaultOption(select);
                if (!target) {
                    return;
                }

                if (select.value !== target.value) {
                    select.value = target.value;
                    select.dispatchEvent(new Event("change", {bubbles: true}));
                }
                saveModel(target.value);
            }

            function rememberSelectedModel() {
                var select = document.getElementById("chat-model-select");
                if (select && select.value) {
                    saveModel(select.value);
                }
            }

            function start() {
                var select = document.getElementById("chat-model-select");
                if (!select) {
                    return;
                }

                select.addEventListener("change", rememberSelectedModel);
                document.addEventListener("click", function (event) {
                    var option = event.target.closest && event.target.closest(".chat-model-picker-option[data-model-id]");
                    if (option) {
                        setTimeout(rememberSelectedModel, 0);
                    }
                }, true);

                ensureModelSelected();
                [100, 500, 1500, 3000].forEach(function (delay) {
                    setTimeout(ensureModelSelected, delay);
                });
                timer = window.setInterval(ensureModelSelected, 2000);
            }

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", start);
            } else {
                start();
            }
        }());

        <script>
        (function () {
            var modelStorageKey = "mlp_ai_chat_selected_model";
            var conversationsStorageKey = "mlp_ai_chat_conversations_v2";
            var reconcileTimer = null;
            var hasInitializedModel = false;

            function storageGet(key) {
                try {
                    return window.localStorage.getItem(key) || "";
                } catch (ignore) {
                    return "";
                }
            }

            function storageSet(key, value) {
                if (!value) {
                    return;
                }
                try {
                    window.localStorage.setItem(key, value);
                } catch (ignore) {}
            }

            function enabledOption(select, value) {
                if (!value) {
                    return null;
                }
                return Array.prototype.find.call(select.options, function (option) {
                    return option.value === value && !option.disabled;
                }) || null;
            }

            function firstUsableOption(select) {
                return Array.prototype.find.call(select.options, function (option) {
                    return !option.disabled;
                }) || null;
            }

            function redrawModelPicker(select, selectedOption) {
                var label = selectedOption.getAttribute("data-label") ||
                    selectedOption.textContent || selectedOption.value;
                var labelElement = document.getElementById("chat-model-picker-trigger-label");
                var iconElement = document.getElementById("chat-model-picker-trigger-icon");

                        image.alt = "";

                        image.height = 32;

            function rememberModel() {

            header.insertBefore(zipButton, closeButton);

            function updateButton() {
                var hasFiles = !!list.querySelector(".chat-files-sidebar-item-dl[data-file-id]");
                zipButton.style.display = hasFiles ? "inline-flex" : "none";
            }

            function readBlob(blob) {
                if (blob && typeof blob.text === "function") return blob.text();
                return new Promise(function (resolve, reject) {
                    var reader = new FileReader();
                    reader.onload = function () { resolve(String(reader.result || "")); };
                    reader.onerror = function () { reject(new Error("Could not read a generated file.")); };
                    reader.readAsText(blob);
                });
            }

            function captureGeneratedFiles(buttons) {
                var captured = [];
                var currentBlob = null;
                var originalCreate = URL.createObjectURL;
                var anchorPrototype = window.HTMLAnchorElement.prototype;
                var originalAnchorClick = anchorPrototype.click;
                try {
                    URL.createObjectURL = function (blob) {
                        if (blob && blob.type === "text/plain") currentBlob = blob;
                        return originalCreate.call(URL, blob);
                    };
                    anchorPrototype.click = function () {
                        if (currentBlob && this.download) {
                            captured.push({ name: this.download, blob: currentBlob });
                            currentBlob = null;
                            if (this.href && /^blob:/.test(this.href)) URL.revokeObjectURL(this.href);
                            return;
                        }
                        return originalAnchorClick.call(this);
                    };
                    buttons.forEach(function (button) { button.click(); });
                } finally {
                    URL.createObjectURL = originalCreate;
                    anchorPrototype.click = originalAnchorClick;
                }

                    return readBlob(item.blob).then(function (text) {
                        return { name: item.name, text: text };
                    });
                }));

            function safeZipName(name) {
                var parts = String(name || "").replace(/\\/g, "/").split("/");
                parts = parts.filter(function (part) {
                    return part && part !== "." && part !== ".." && !/^[A-Za-z]:$/.test(part);
                });
                return parts.join("/") || "generated-file.txt";
            }

            function crc32(bytes) {
                var crc = 0xFFFFFFFF;
                for (var i = 0; i < bytes.length; i++) {
                    crc ^= bytes[i];
                    for (var bit = 0; bit < 8; bit++) {
                        crc = (crc >>> 1) ^ ((crc & 1) ? 0xEDB88320 : 0);
                    }
                }
                return (crc ^ 0xFFFFFFFF) >>> 0;

            function makeZip(files) {
                var encoder = new TextEncoder();
                var localParts = [];
                var centralParts = [];
                var offset = 0;
                var totalSize = 0;
                var seenNames = {};
                files.forEach(function (file) {
                    var name = safeZipName(file.name);
                    var originalName = name;
                    var suffix = 2;
                    while (seenNames[name]) {
                        var slash = originalName.lastIndexOf("/");
                        var directory = slash >= 0 ? originalName.slice(0, slash + 1) : "";
                        var leaf = slash >= 0 ? originalName.slice(slash + 1) : originalName;
                        var dot = leaf.lastIndexOf(".");
                        var base = dot > 0 ? leaf.slice(0, dot) : leaf;
                        var extension = dot > 0 ? leaf.slice(dot) : "";
                        name = directory + base + " (" + suffix++ + ")" + extension;

                    localView.setUint16(8, 0, true);
                    localView.setUint16(10, 0, true);

                    local.set(nameBytes, 30);
                    localParts.push(local, data);

                    var central = new Uint8Array(46 + nameBytes.length);
                    var centralView = new DataView(central.buffer);
                    centralView.setUint32(0, 0x02014B50, true);
                    centralView.setUint16(4, 20, true);
                    centralView.setUint16(6, 20, true);
                    centralView.setUint16(8, 0x0800, true);
                    centralView.setUint16(10, 0, true);
                    centralView.setUint16(12, 0, true);
                    centralView.setUint16(14, 0x0021, true);
                    centralView.setUint32(16, crc, true);
                    centralView.setUint32(20, data.length, true);
                    centralView.setUint32(24, data.length, true);
                    centralView.setUint16(28, nameBytes.length, true);
                    centralView.setUint16(30, 0, true);
                    centralView.setUint16(32, 0, true);
                    centralView.setUint16(34, 0, true);
                    centralView.setUint16(36, 0, true);
                    centralView.setUint32(38, 0, true);
                    centralView.setUint32(42, offset, true);
                    central.set(nameBytes, 46);
                    centralParts.push(central);
                    offset += local.length + data.length;

                var centralSize = centralParts.reduce(function (size, part) { return size + part.length; }, 0);
                var end = new Uint8Array(22);
                var endView = new DataView(end.buffer);
                endView.setUint32(0, 0x06054B50, true);
                endView.setUint16(4, 0, true);
                endView.setUint16(6, 0, true);
                endView.setUint16(8, files.length, true);
                endView.setUint16(10, files.length, true);
                endView.setUint32(12, centralSize, true);
                endView.setUint32(16, offset, true);
                endView.setUint16(20, 0, true);
                return new Blob(localParts.concat(centralParts, [end]), { type: "application/zip" });
            }

            function createArchiveFromButtons(buttons) {
                return captureGeneratedFiles(buttons).then(function (files) {
                    if (!files.length) throw new Error("No generated files were found to package.");
                    return { blob: makeZip(files), files: files };
                });
            }

            function downloadArchive(blob, filename) {
                var url = URL.createObjectURL(blob);
                var link = document.createElement("a");
                link.href = url;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                link.remove();
                window.setTimeout(function () { URL.revokeObjectURL(url); }, 60000);

            function isZipCreationRequest(text) {
                var value = String(text || "");
                if (!/\b(?:zip|archive|bundle)\b/i.test(value)) return false;
                return /\b(?:make|create|generate|build|package|compress|send|give|download|export|attach|turn|convert)\b/i.test(value)

                var label = document.createElement("span");

                var generating = !!(sendButton && sendButton.classList.contains("is-stop"));

                var fileCards = Array.prototype.slice.call(
                    assistant.querySelectorAll(".chat-file-card[data-file-id], .chat-live-code-file[data-file-id]")

                var buttons = Array.prototype.slice.call(
                    list.querySelectorAll(".chat-files-sidebar-item-dl[data-file-id]")
                ).filter(function (button) {
                    return ids[button.dataset.fileId];
                });
                var userText = turn.user.querySelector(".chat-msg-text");
                var packageExistingFiles = /\b(?:zip|archive|bundle)\b.{0,60}\b(?:this|it|these|those|the files?|previous|above|existing|my files?)\b/i
                    .test(userText ? userText.textContent : turn.user.textContent);
                if (!buttons.length && packageExistingFiles) {
                    buttons = Array.prototype.slice.call(
                        list.querySelectorAll(".chat-files-sidebar-item-dl[data-file-id]")
                    );
                }

                if (!buttons.length) {
                    var age = Date.now() - (window.__pteroAiZipRequestAt || Date.now());

            zipButton.addEventListener("click", function () {
                var buttons = Array.prototype.slice.call(
                    list.querySelectorAll(".chat-files-sidebar-item-dl[data-file-id]")

        }());

        <script>
        (function () {
            function isCodeLikeActivityLabel(value) {
                var label = String(value || "").trim();
                if (!label) return false;
                if (/^code\s*:?\s*$/i.test(label)) return true;
                if (/^(?:`{3,}|~{3,})/.test(label)) return true;
                if (/^(?:<!doctype\b|<\?php\b|<\/?[a-z][\w:-]*(?:\s|\/?>))/i.test(label)) return true;
                if (/^\s*(?:[.#*][\w*.-]*\s*\{|[\w-]+\s*:\s*[^;]+;)/.test(label)) return true;
                if (/^\s*(?:function\b|(?:const|let|var)\s+[\w$]+|return\b|class\b|def\b|import\s+[\w*$])/i.test(label) && /[=({;:[\]]/.test(label)) return true;
                return /^\s*(?:\/\/|\/\*|\*\/)/.test(label);
            }

            function normalActivityLabel(type) {
                switch (String(type || "").toLowerCase()) {
                    case "editing": return "Updating the requested file";
                    case "reading": return "Reading relevant information";
                    case "checking": return "Checking the result";
                    default: return "Working through the request";
                }
            }

            function sanitizeActivityRow(row) {
                if (!row || row.dataset.pteroCodeActivityFiltered === "1") return;
                var icon = row.querySelector(".chat-activity-icon");
                var label = icon && icon.nextElementSibling;
                if (!label || !isCodeLikeActivityLabel(label.textContent)) return;
                var replacement = normalActivityLabel(row.dataset.type);
                label.textContent = replacement;
                var detail = row.querySelector(".chat-activity-detail");
                if (detail) detail.textContent = replacement + ".";
                row.dataset.pteroCodeActivityFiltered = "1";
                var previous = row.previousElementSibling;
                if (previous && previous.dataset.pteroCodeActivityFiltered === "1") {
                    var previousIcon = previous.querySelector(".chat-activity-icon");
                    var previousLabel = previousIcon && previousIcon.nextElementSibling;
                    if (previousLabel && previousLabel.textContent === replacement && row.parentNode) {
                        row.parentNode.removeChild(row);
                    }
                }
            }

            function scanNode(node) {
                if (!node || node.nodeType !== 1) return;
                if (node.matches && node.matches(".chat-activity-row")) sanitizeActivityRow(node);
                if (node.querySelectorAll) {
                    Array.prototype.forEach.call(node.querySelectorAll(".chat-activity-row"), sanitizeActivityRow);
                }
            }

            function start() {
                var app = document.querySelector(".chat-ai-chat-app");
                if (!app) return;
                scanNode(app);
                new MutationObserver(function (records) {
                    records.forEach(function (record) {
                        var target = record.target;
                        if (target.nodeType !== 1) target = target.parentElement;
                        if (target && target.closest) sanitizeActivityRow(target.closest(".chat-activity-row"));
                        Array.prototype.forEach.call(record.addedNodes || [], scanNode);
                    });
                }).observe(app, { childList: true, subtree: true });
            }

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", start, { once: true });
            } else {
                start();
            }
        }());
        </script>

            function addStyles() {
                if (document.getElementById("ptero-file-card-download-style")) return;
                var style = document.createElement("style");

                    "}";
                (document.head || document.documentElement).appendChild(style);
            }

            function downloadFromSidebar(fileId) {
                var buttons = document.querySelectorAll(".chat-files-sidebar-item-dl[data-file-id]");
                for (var i = 0; i < buttons.length; i++) {
                    if (buttons[i].getAttribute("data-file-id") === fileId) {
                        buttons[i].click();
                        return true;
                    }
                }
                return false;
            }

            var fileIconRootSelector =
                ".chat-msg-file:not(.chat-msg-file-github),.chat-attach-chip,.chat-file-card," +
                ".chat-files-sidebar-item,.chat-project-file-item,.chat-media-item";

            function enhanceLanguageIcon(root) {
                if (!root || !root.matches || !root.matches(fileIconRootSelector)) return;
                var name = root.querySelector(
                    ".chat-msg-file-name,.chat-attach-chip-name,.chat-file-card-name," +
                    ".chat-files-sidebar-item-name,.chat-project-file-name,.chat-media-item-name"
                );
                var host = root.querySelector(
                    ".chat-media-item-file-icon,.chat-attach-chip-icon,.chat-file-card-icon," +
                    ".chat-files-sidebar-item-icon,.chat-project-file-icon"
                );
                var messageIcon = null;
                if (!host && root.matches(".chat-msg-file")) {
                    host = root;
                    messageIcon = root.querySelector("svg");
                }
                if (!host || !name) return;

                var fileName = name.textContent.trim();
                var logo = languageLogo(fileName);
                if (!logo) return;
                if (host.getAttribute("data-ptero-language-logo") === fileName) {
                    var existingLogo = messageIcon
                        ? messageIcon.classList.contains("chat-language-logo")
                        : host.querySelector(".chat-language-logo");
                    if (existingLogo) return;
                }
                if (messageIcon) messageIcon.outerHTML = logo;
                else host.innerHTML = logo;
                host.setAttribute("data-ptero-language-logo", fileName);
            }

            function enhanceCard(card) {
                if (!card || !card.matches || !card.matches(".chat-file-card.chat-artifact-card")) return;
                var main = card.querySelector(".chat-file-card-main");
                if (!main) return;
                var actions = card.querySelector(".chat-file-card-actions");
                if (!actions) {
                    actions = document.createElement("div");
                    actions.className = "chat-file-card-actions";
                }
                Array.prototype.slice.call(card.children).forEach(function (child) {
                    if (child !== main && child !== actions) actions.appendChild(child);
                });
                if (actions.parentNode !== card) card.appendChild(actions);

                var isUpdatingLive = card.classList.contains("chat-live-code-file");
                var downloadButton = actions.querySelector(".chat-card-download-btn");
                if (downloadButton) downloadButton.hidden = isUpdatingLive;

                var fileId = card.getAttribute("data-file-id");
                if (!fileId || downloadButton) return;
                var button = document.createElement("button");
                button.type = "button";
                button.className = "chat-file-card-btn chat-card-download-btn";
                button.hidden = isUpdatingLive;
                button.setAttribute("data-file-id", fileId);
                button.setAttribute("title", "Download");
                button.setAttribute("aria-label", "Download");
                button.textContent = "Download";
                button.addEventListener("click", function (event) {
                    event.preventDefault();
                    event.stopPropagation();
                    downloadFromSidebar(fileId);
                });
                button.addEventListener("keydown", function (event) {
                    if (event.key === "Enter" || event.key === " ") event.stopPropagation();
                });
                actions.appendChild(button);
            }

            function enhanceTarget(node) {
                if (!node || !node.closest) return;
                var fileIconTarget = node.closest(fileIconRootSelector);
                if (fileIconTarget) enhanceLanguageIcon(fileIconTarget);
                var cardTarget = node.closest && node.closest(".chat-file-card.chat-artifact-card");
                if (cardTarget) enhanceCard(cardTarget);
            }

            function processNode(node) {
                if (!node || node.nodeType !== 1) return;
                if (node.matches && node.matches(fileIconRootSelector)) enhanceLanguageIcon(node);
                if (node.querySelectorAll) {
                    Array.prototype.forEach.call(
                        node.querySelectorAll(fileIconRootSelector),
                        enhanceLanguageIcon
                    );
                }
                if (node.matches && node.matches(".chat-file-card.chat-artifact-card")) enhanceCard(node);
                if (node.querySelectorAll) {
                    Array.prototype.forEach.call(
                        node.querySelectorAll(".chat-file-card.chat-artifact-card"),
                        enhanceCard
                    );
                }
                enhanceTarget(node);
            }

            function start() {
                addStyles();
                processNode(document.body);
                if (!document.body || !window.MutationObserver) return;
                new MutationObserver(function (records) {
                    records.forEach(function (record) {
                        Array.prototype.forEach.call(record.addedNodes || [], processNode);
                        var target = record.target;
                        if (target && target.nodeType !== 1) target = target.parentElement;
                        if (target) enhanceTarget(target);
                    });
                }).observe(document.body, { childList: true, subtree: true });
            }

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", start, { once: true });
            } else {
                start();
            }
        }());
